<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative modern circles -->
  <circle cx="1100" cy="100" r="280" fill="#0284c7" opacity="0.06"/>
  <circle cx="150" cy="550" r="220" fill="#0d9488" opacity="0.05"/>
  <circle cx="1050" cy="520" r="160" fill="#38bdf8" opacity="0.08"/>

  <!-- Main Glassmorphism Card Container -->
  <rect x="80" y="60" width="1040" height="510" rx="32" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Header badges -->
  <g transform="translate(130, 115)">
    <!-- Pill 1: Institución -->
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="65" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0284c7" text-anchor="middle">UNERG • 2026</text>

    <!-- Pill 2: Ámbito Hospitalario -->
    <rect x="145" y="0" width="230" height="36" rx="18" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
    <text x="260" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">HCUAMP BARQUISIMETO</text>

    <!-- Pill 3: Investigadora Destacada -->
    <rect x="390" y="0" width="280" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="530" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">Investigadora: Lcda. María Pargas</text>
  </g>

  <!-- Title -->
  <text x="130" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Estrategia de Formación en SST para
  </text>
  <text x="130" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0284c7" letter-spacing="-0.5">
    Gerentes y Supervisores del HCUAMP
  </text>

  <!-- Subtitle -->
  <text x="130" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#475569">
    Plataforma de recolección de datos, diagnóstico LOPCYMAT y validación por juicio de expertos.
  </text>
  <text x="130" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#64748b">
    Maestría en Gerencia de la Salud Pública • Hospital Central Universitario Dr. Antonio María Pineda
  </text>

  <!-- Feature Grid Cards -->
  <g transform="translate(130, 385)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="250" height="110" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="40" cy="40" r="18" fill="#e0f2fe"/>
    <text x="40" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#0284c7" text-anchor="middle">📋</text>
    <text x="70" y="44" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Encuesta al Personal</text>
    <text x="25" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Diagnóstico de 4 dimensiones</text>
    <text x="25" y="93" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Test LOPCYMAT y Escala Likert</text>

    <!-- Feature 2 -->
    <rect x="270" y="0" width="250" height="110" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="310" cy="40" r="18" fill="#ccfbf1"/>
    <text x="310" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#0d9488" text-anchor="middle">⚖️</text>
    <text x="340" y="44" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Juicio de Expertos</text>
    <text x="295" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Matriz de 40 reactivos</text>
    <text x="295" y="93" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Claridad, Pertinencia, Coherencia</text>

    <!-- Feature 3 -->
    <rect x="540" y="0" width="250" height="110" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="580" cy="40" r="18" fill="#fef3c7"/>
    <text x="580" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#d97706" text-anchor="middle">📊</text>
    <text x="610" y="44" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Dashboard Estadístico</text>
    <text x="565" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Analítica en tiempo real</text>
    <text x="565" y="93" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Diagramas Radar y Barras</text>
  </g>

  <!-- Large Right Graphic Emblem (Hospital Shield) -->
  <g transform="translate(930, 260)" filter="url(#softShadow)">
    <circle cx="60" cy="60" r="85" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
    <!-- Shield -->
    <path d="M60 10 L105 30 C105 75 85 105 60 118 C35 105 15 75 15 30 Z" fill="url(#primaryGrad)"/>
    <!-- Inner Cross -->
    <path d="M52 38 H68 V52 H82 V68 H68 V82 H52 V68 H38 V52 H52 Z" fill="#ffffff"/>
  </g>
</svg>
